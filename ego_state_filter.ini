# 


[agents]
# Settings shared by all agents
frontend_address = "tcp://localhost:9090"
backend_address = "tcp://localhost:9091"
settings_address = "tcp://localhost:9092"
compress = true
timecode_fps = 25


#  __  __                   _ _ _   _     _      
# |  \/  | ___  _ __   ___ | (_) |_| |__ (_) ___ 
# | |\/| |/ _ \| '_ \ / _ \| | | __| '_ \| |/ __|
# | |  | | (_) | | | | (_) | | | |_| | | | | (__ 
# |_|  |_|\___/|_| |_|\___/|_|_|\__|_| |_|_|\___|
#                                                

[broker]
frontend_address = "tcp://*:9090"
backend_address = "tcp://*:9091"
settings_address = "tcp://*:9092"


[logger]
mongo_uri = "mongodb://localhost:27017"
mongo_db = "mads_test"
# sub_topic = ["logger", "metadata", "rfid", "skeleton", "platform", "image", "agent_event", "bridge", "perf_assess"]
# or, subscribe to all topics:
sub_topic = [""]
max_length = 75
initially_paused = false


[bridge]
# default publish topic (if not passed via CLI)
sub_topic = ["publish"]
pub_topic = "bridge"


[feedback]
# Subscribes to ALL topics
sub_topic = [""]
print_width = 0
indent_width = 2

[metadata]
# Topic to publish to (single string!)
pub_topic = "metadata"


[perf_assess]
pub_topic = "perf_assess"

[publish]
pub_topic = "publish"

[dealer]
sub_topic = ["publish", "spawner"]
pub_topic = "dealer"
dealer_address = "tcp://*:9093"

[worker]
pub_topic = "worker"
dealer_address = "tcp://localhost:9093"


#  ____  _             _           
# |  _ \| |_   _  __ _(_)_ __  ___ 
# | |_) | | | | |/ _` | | '_ \/ __|
# |  __/| | |_| | (_| | | | | \__ \
# |_|   |_|\__,_|\__, |_|_| |_|___/
#                |___/             
#

[echoj]
# Topic to publish to (single string!)
pub_topic = "echoj"
sub_topic = ["rfid"]


[clock]
# Topic to publish to (single string!)
pub_topic = "clock"
period = 200

[imu]

[rerunner_imu]
sub_topic = ["imu"]
keypaths = ["/imu/message/accel/0"]
[rerunner_filter]
sub_topic = ["sequence_filter"]
keypaths = ["/sequence_filter/filtered_signal", "/sequence_filter/raw_signal"]
[rerunner_myfilter]
sub_topic = ["my_filter"]
keypaths = ["/my_filter/raw_data", "my_filter/filtered data"]

[replay_imu]
pub_topic = "imu"
csv_file = "/home/matteo/repo/MADS/csv/walker.imu.csv"
loop = true # once the end of file has been reached, start again from beginning

[sequence_filter]
sub_topic = ["imu"]
period = 10
a0 = 1
a1 = -1.56101807580072
a2 = 0.641351538057563
b0 = 0.0200833655642112
b1 = 0.0401667311284225 
b2 = 0.0200833655642112

[hat]
pub_topic = "imu"
period = 20
[hat.enabled_sensors]
gyro = true
humidity = false
pressure = false
compass = true

[my_filter]
sub_topic = "imu"
a0 = 1
a1 = -1.5610
a2 = 0.6414
b0 = 0.0201
b1 = 0.0402
b2 = 0.0201

# Replace the dummy values with your own parameters and filter coefficients

[ego_state_filter]
sub_topic = ["driver", "calibrated_imu", "htc"]
pub_topic = "ego_state_X"   # X = group number

wheel_radius = 0.1          # [m]   TODO
wheel_base = 0.5            # [m]   TODO
counts_per_rev = 4096       # [tics/rev]
gyro_bias = 0.0             # [rad/s] TODO
Tc = 0.03                   # [s] nominal period used to discretize the filters

imu = { sigma_gyro = 0.01 } # [rad/s] TODO

# From MATLAB: a = ah_* (= al_*), b_hp = bh_*, b_lp = bl_*
attitude_filter = { a = [1.0, 0.0, 0.0, 0.0], b_hp = [0.0, 0.0, 0.0, 0.0], b_lp = [1.0, 0.0, 0.0, 0.0] }
position_filter = { a = [1.0, 0.0, 0.0, 0.0], b_hp = [0.0, 0.0, 0.0, 0.0], b_lp = [1.0, 0.0, 0.0, 0.0] }
