# Replace the dummy values with your own parameters and filter coefficients

[ego_state_filter]
sub_topic = ["driver", "calibrated_imu", "htc"]
pub_topic = "ego_state_6"   # X = group number

wheel_radius = 0.1          # [m]   TODO
wheel_base = 0.5            # [m]   TODO
counts_per_rev = 4096       # [tics/rev]
gyro_bias = -0.0005         # [rad/s] start value, then updated by gyro_bias_agent
Tc = 0.03                   # [s] nominal period used to discretize the filters

imu = { sigma_gyro = 0.01 } # [rad/s] TODO

# From MATLAB: a = ah_* (= al_*), b_hp = bh_*, b_lp = bl_*
# fc = 2.5 Hz, Tc = 0.03 s, 3rd-order Butterworth, Tustin
# From MATLAB: a = ah_* (= al_*), b_hp = bh_*, b_lp = bl_*
# 3rd-order Butterworth, Tustin, Tc = 0.03 s

# fc = 2.5 Hz
fc_2_5Hz = { a = [1.0, -2.0816484573451404, 1.5400797201536036, -0.3928368757806467], b_hp = [0.6268206316599237, -1.8804618949797711, 1.8804618949797711, -0.6268206316599237], b_lp = [0.373179368340076, -0.20118656236536878, -0.3403821748261676, 0.23398375587927714] }

# fc = 0.05 Hz
fc_0_05Hz = { a = [1.0, -2.981150653361599, 2.9624785371096642, -0.9813270544316375], b_hp = [0.9906195306128626, -2.9718585918385876, 2.9718585918385876, -0.9906195306128626], b_lp = [0.009380469387137423, -0.009292061523011258, -0.009380054728923533, 0.009292476181225149] }

# fc = 0.01 Hz
fc_0_01Hz = { a = [1.0, -2.996230090490028, 2.992467283740247, -0.9962371865654753], b_hp = [0.9981168200994687, -2.994350460298406, 2.994350460298406, -0.9981168200994687], b_lp = [0.0018831799005311488, -0.0018796301916216658, -0.0018831765581594302, 0.0018796335339933844] }

attitude_filter = fc_0_05Hz
position_filter = fc_0_01Hz

# Gyroscope bias estimator (slide 21), feeds gyro_bias to ego_state_filter
[gyro_bias_agent]
sub_topic = ["driver", "calibrated_imu"]
pub_topic = "gyro_bias"

still_min = 60              # [driver messages] standing still for ~0.5 s
imu_period = 0.02           # [s] calibrated_imu period (from the recording)
tau = 10.0                  # [s] memory of the moving average
max_rate = 0.05             # [rad/s] readings further from the estimate are skipped

# Visualization of the filter output (slide 55)
# Run with: mads sink rerunner.plugin -n rerunner_ego
# Replace ego_state_X with your topic name (also in the keypaths)
# TODO: check the hmat_keypaths format in the rerunner_plugin repository
[rerunner_ego]
sub_topic = ["ego_state_6", "htc", "ego_state"]
keypaths = [
  "/ego_state_6/pose/x", "/ego_state_6/pose/y", "/ego_state_6/pose/delta",
  "/ego_state_6/debug/delta_EG", "/ego_state_6/debug/delta_H", "/ego_state_6/debug/delta_F",
  "/ego_state_6/debug/x_E", "/ego_state_6/debug/x_H",
  "/ego_state_6/debug/y_E", "/ego_state_6/debug/y_H",
  "/ego_state_6/debug/mu", "/ego_state_6/debug/xi_R",
    # Reference fused pose from the lecturer (topic ego_state in the bag)
  "/ego_state/ego_state/x", "/ego_state/ego_state/y", "/ego_state/ego_state/theta"
]
# 3D poses: our estimate, the HTC measurement and the reference ego_state
hmat_keypaths = ["/ego_state_6/H", "/htc/Htracker/pose/H", "/ego_state/H"]

# Agents for replay and recording of bag files
[play]
[record]