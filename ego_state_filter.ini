[ego_state_filter]
sub_topic = ["driver", "calibrated_imu", "htc", "gyro_bias"]
pub_topic = "ego_state_6"   

wheel_radius = 0.09          # [m]   
wheel_base = 0.91            # [m]   
counts_per_rev = 4096       # [tics/rev]
gyro_bias = 0         # [rad/s] start value, then updated by gyro_bias_agent
Tc = 0.03                   # [s] nominal period used to discretize the filters


# From MATLAB: a = ah_* (= al_*), b_hp = bh_*, b_lp = bl_*
# Tc = 0.03 s, 3rd-order Butterworth, Tustin

[ego_state_filter.attitude_filter]   # fc = 0.01 Hz
a    = [                   1.0,     -2.996230090490028,      2.992467283740247,    -0.9962371865654753]
b_hp = [    0.9981168200994687,     -2.994350460298406,      2.994350460298406,    -0.9981168200994687]
b_lp = [ 0.0018831799005311488, -0.0018796301916216658, -0.0018831765581594302,  0.0018796335339933844]

[ego_state_filter.position_filter]   # fc = 0.007 Hz
a    = [                   1.0,    -2.9973610627452825,     2.9947256063368872,    -0.9973645412974412]
b_hp = [    0.9986814012974515,    -2.9960442038923545,     2.9960442038923545,    -0.9986814012974515]
b_lp = [ 0.0013185987025486651, -0.0013168588529283267, -0.0013185975554666897,  0.0013168600000103023]


